spring.application.name=mobile-repair-stock-backend
server.port=8080

# Enable Firebase (Auth + Firestore). Requires GOOGLE_APPLICATION_CREDENTIALS
# pointing at a service-account JSON, or a FIREBASE_CREDENTIALS_JSON env value.
app.firebase.enabled=false

# Session cookie lifetime in days for the server-side Firebase session.
app.firebase.session-ttl-days=5

logging.level.com.mobilerepair=INFO
