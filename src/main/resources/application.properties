spring.application.name=mobile-repair-stock-backend
server.port=8080

# Enable Firebase (Auth + Firestore). Requires GOOGLE_APPLICATION_CREDENTIALS
# pointing at a service-account JSON, or a FIREBASE_CREDENTIALS_JSON env value.
app.firebase.enabled=false

# Session cookie lifetime in days for the server-side Firebase session.
app.firebase.session-ttl-days=5

# Durable storage. Set DATABASE_URL (a postgres:// or jdbc:postgresql:// URL) to
# persist documents in PostgreSQL across restarts. Leave blank to use the
# in-memory store (data resets on every restart).
# On Render (https://mobile-repair-stock.onrender.com) paste only the Internal
# Database URL. Do not append notes. Placeholder USER/PASSWORD values are ignored.
app.database.url=${DATABASE_URL:}
app.database.user=${DATABASE_USER:}
app.database.password=${DATABASE_PASSWORD:}

logging.level.com.mobilerepair=INFO
